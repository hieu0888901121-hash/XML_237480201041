<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            myFunction(this);
        }
    };
    xhttp.open("GET", "menu.xml", true);
    xhttp.send();

    function myFunction(xml) {
        var x, y, z, i, xLen, yLen, newEle, newText, xmlDoc, txt;
    xmlDoc = xml.responseXML;
    txt = "";
    x = xmlDoc.getElementsByTagName("Doan");
    xLen = x.length;
    for (i = 0; i < xLen; i++) { 
        newEle = xmlDoc.createElement("danhgia");
        newText = xmlDoc.createTextNode("5 sao");
        newEle.appendChild(newText);
        x[i].appendChild(newEle);
    }
    // Output all titles and editions
    y = xmlDoc.getElementsByTagName("tenmon");
    yLen = y.length
    z = xmlDoc.getElementsByTagName("danhgia");
    for (i = 0; i < yLen; i++) { 
        txt += y[i].childNodes[0].nodeValue + 
        " - Danh gia: " + 
        z[i].childNodes[0].nodeValue + "<br>";
    }
    document.getElementById("demo").innerHTML = txt; 
    }
</script>

</body>
</html>
