<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            myFunction(this);
        }
    };
    xhttp.open("GET", "library (2).xml", true);
    xhttp.send();

    function myFunction(xml) {
        var xmlDoc = xml.responseXML;
        var x;    
        var txt = "";
        x = xmlDoc.getElementsByTagName("ten_sach")[0].childNodes[0];
        txt += x.nodeValue + "<br>";    
        x.nodeValue = "Tinh Than Bien";
        x = xmlDoc.getElementsByTagName("ten_sach")[0].childNodes[0];
        txt += x.nodeValue + "<br>";    
        document.getElementById("demo").innerHTML = txt;
}
</script>
</body>
</html>
