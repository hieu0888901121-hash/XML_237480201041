<!DOCTYPE html>
<html>
<body>
    <h2>Tăng lương nhân viên</h2>
    <div id="demo"></div>

    <script>
        var xhttp = new XMLHttpRequest();

        xhttp.onload = function() {
            var xmlDoc = this.responseXML;
            var list = xmlDoc.getElementsByTagName("nhanvien");

            for (var i = 0; i < list.length; i++) {
                var donvi = list[i].getElementsByTagName("donvi")[0].textContent;

                if (donvi == "Kỹ thuật") {
                    var luong = list[i].getElementsByTagName("luong")[0];

                    var tien = Number(luong.textContent);
                    luong.firstChild.nodeValue = tien * 1.1;
                }
            }

            document.getElementById("demo").innerHTML =
                new XMLSerializer().serializeToString(xmlDoc);
        };

        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
    </script>
</body>
</html>
