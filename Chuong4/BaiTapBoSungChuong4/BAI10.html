<!DOCTYPE html>
<html>
<body>
    <h2>Quản lý nhân viên</h2>

    <input type="text" id="timkiem"
        placeholder="Nhập tên đơn vị..." oninput="hienThi()">

    <table border="1" cellpadding="8">
        <tr>
            <th>Mã NV</th>
            <th>Họ tên</th>
            <th>Đơn vị</th>
            <th>Lương</th>
        </tr>
        <tbody id="demo"></tbody>
    </table>

    <script>
        var xhttp = new XMLHttpRequest();
        var nhanviens = [];

        xhttp.onload = function() {
            var xmlDoc = this.responseXML;
            nhanviens = xmlDoc.getElementsByTagName("nhanvien");

            hienThi();
        };

        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();

        function hienThi() {
            var timkiem = document.getElementById("timkiem").value.toLowerCase();
            var kq = "";

            for (var i = 0; i < nhanviens.length; i++) {
                var ma = nhanviens[i].getElementsByTagName("manv")[0].textContent;
                var ten = nhanviens[i].getElementsByTagName("tennv")[0].textContent;
                var donvi = nhanviens[i].getElementsByTagName("donvi")[0].textContent;
                var luong = nhanviens[i].getElementsByTagName("luong")[0].textContent;

                if (donvi.toLowerCase().includes(timkiem)) {
                    kq += "<tr>";
                    kq += "<td>" + ma + "</td>";
                    kq += "<td>" + ten + "</td>";
                    kq += "<td>" + donvi + "</td>";
                    kq += "<td>" + luong + "</td>";
                    kq += "</tr>";
                }
            }

            document.getElementById("demo").innerHTML = kq;
        }
    </script>
</body>
</html>
