<!DOCTYPE html>
<html>
<body>
    <h2>Thông tin sách</h2>
    <p id="demo"></p>

    <script>
        var xmlStr = "<book><title>Lap trinh Web</title><author>Nguyen Van A</author><year>2024</year><price>50</price></book>";

        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlStr, "text/xml");

        var book = xmlDoc.documentElement;

        document.getElementById("demo").innerHTML =
            "Nút đầu tiên: " + book.firstElementChild.textContent + "<br>" +
            "Nút cuối cùng: " + book.lastElementChild.textContent;
    </script>
</body>
</html>
