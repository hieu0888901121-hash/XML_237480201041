<!DOCTYPE html>
<html>
<body>
    <h2>Thông tin nhân viên</h2>
    <div id="demo"></div>

    <script>
        var xhttp = new XMLHttpRequest();

        xhttp.onload = function() {
            var xmlDoc = this.responseXML;
            var list = xmlDoc.getElementsByTagName("manv");
            var kq = "";

            for (var i = 0; i < list.length; i++) {
                if (list[i].textContent == "002") {
                    var nhanvien = list[i].parentNode;
                    var donvi = nhanvien.getElementsByTagName("donvi")[0].textContent;

                    kq = "Đơn vị: " + donvi;
                }
            }

            document.getElementById("demo").innerHTML = kq;
        };

        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
    </script>
</body>
</html>
