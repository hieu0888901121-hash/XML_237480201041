<!DOCTYPE html>
<html>
<body>
    <h2>Kết quả XML</h2>
    <p id="demo"></p>

    <script>
        var xmlStr = "<class><student><name>Nguyen Van A</name><age>20</age></student></class>";

        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlStr, "text/xml");

        var root = xmlDoc.documentElement;

        document.getElementById("demo").innerHTML =
            "Tên nút gốc: " + root.nodeName + "<br>" +
            "Tên nút con đầu tiên: " + root.firstElementChild.nodeName;
    </script>
</body>
</html>
