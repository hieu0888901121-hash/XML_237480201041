<!DOCTYPE html>
<html>
<body>
    <h2>Thêm sách mới</h2>
    <div id="demo"></div>

    <script>
        var xmlStr = "<bookstore><book><title>Sach A</title><price>20</price></book></bookstore>";

        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlStr, "text/xml");

        var book = xmlDoc.createElement("book");

        var title = xmlDoc.createElement("title");
        title.textContent = "Lap trinh JavaScript";

        var price = xmlDoc.createElement("price");
        price.textContent = "50";

        book.appendChild(title);
        book.appendChild(price);

        xmlDoc.documentElement.appendChild(book);

        document.getElementById("demo").innerHTML =
            new XMLSerializer().serializeToString(xmlDoc);
    </script>
</body>
</html>
