
<!DOCTYPE html>
<html lang="vi">
<body>
    <h2>Kết quả sau khi xóa nhân viên</h2>
    <p id="demo"></p>
<script>
    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            myFunction(this);
        }
    };

    xhttp.open("GET", "danhsachnhanvien.xml", true);
    xhttp.send();

    function myFunction(xml) {
        var xmlDoc, ds, nv, txt;
        xmlDoc = xml.responseXML;
        txt = "Số lượng nhân viên trước khi xóa: " +
        xmlDoc.getElementsByTagName("nhanvien").length + "<br>";
        ds = xmlDoc.getElementsByTagName("manv");
        for (var i = 0; i < ds.length; i++) {
            if (ds[i].textContent.trim() == "001") {
                nv = ds[i].parentNode;
                nv.parentNode.removeChild(nv);
                break;
            }
        }
        txt += "Số lượng nhân viên sau khi xóa: " +
        xmlDoc.getElementsByTagName("nhanvien").length;
        document.getElementById("demo").innerHTML = txt;
    }
</script>

</body>
</html>
