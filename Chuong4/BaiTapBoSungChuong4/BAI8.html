<!DOCTYPE html>
<html>
<body>
    <h2>Xóa nhân viên có mã 001</h2>
    <div id="demo"></div>

    <script>
        var xhttp = new XMLHttpRequest();

        xhttp.onload = function() {
            var xmlDoc = this.responseXML;
            var list = xmlDoc.getElementsByTagName("nhanvien");

            for (var i = 0; i < list.length; i++) {
                var manv = list[i].getElementsByTagName("manv")[0].textContent;

                if (manv == "001") {
                    xmlDoc.documentElement.removeChild(list[i]);
                    break;
                }
            }

            document.getElementById("demo").innerHTML =
                new XMLSerializer().serializeToString(xmlDoc);
        };

        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
    </script>
</body>
</html>
